<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            color: #ffffff;
            margin: 0;
            font-family: 'Fredoka', sans-serif;
            background-color: #051f1e;
            min-height: 100vh;
            background-image: url('bg.png');
            background-size: cover;
        }

        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo {
            border-radius: 50%;
        }

        .links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .links a {
            font-family: 'Fredoka', sans-serif;
            color: rgb(121, 217, 255);
            background-color: rgba(0, 0, 0, 0.5);
            font-size: 20px;
            padding: 8px 12px;
            border: 2px solid #174f61;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .links a:hover {
            color: #ffffff;
            background-color: #23788a;
        }

        .web-intro {
            margin-top: 100px;
            text-align: center;
            font-size: 24px;
        }

    </style>
</head>

<body>

    <nav>
        <img class="logo" src="logo.png" width="50" height="50" alt="Website logo">

        <div class="links">
            <a href="index.html"><b>Home</b></a>
            <a href="imgConv.html"><b>Image Converter</b></a>
            <a href="vidConv.html"><b>Video Converter</b></a>
        </div>
    </nav>

    <div class="web-intro">
        <h1>Welcome to My Website</h1>
        <p>This is a simple website with a navigation bar and some content.</p>
    </div>

</body>

</html>
